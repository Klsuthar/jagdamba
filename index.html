    <!-- PWA Splash Screen Fast Inline Styles -->
    <style>
        #pwa-splash {
            position: fixed;
            inset: 0;
            z-index: 9999999;
            background: radial-gradient(circle at 50% 40%, #0d1e42 0%, #081229 60%, #040914 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Nunito', 'Segoe UI', system-ui, -apple-system, sans-serif;
            transition: opacity 0.45s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.45s ease;
            color: #ffffff;
            text-align: center;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        #pwa-splash.splash-fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .splash-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            max-width: 360px;
            width: 100%;
            position: relative;
        }

        .splash-logo-container {
            position: relative;
            width: 104px;
            height: 104px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .splash-pulse-ring {
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(245, 158, 11, 0.4) 0%, rgba(79, 70, 229, 0.2) 60%, transparent 80%);
            animation: splashPulse 2.2s ease-in-out infinite;
        }

        @keyframes splashPulse {
            0%, 100% { transform: scale(0.95); opacity: 0.5; }
            50% { transform: scale(1.18); opacity: 0.95; }
        }

        .splash-logo-frame {
            position: relative;
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: #ffffff;
            padding: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(245, 158, 11, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: splashPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes splashPop {
            0% { transform: scale(0.65); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .splash-logo-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .splash-title {
            font-size: 1.55rem;
            font-weight: 800;
            letter-spacing: -0.01em;
            margin: 0 0 4px;
            color: #ffffff;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            font-family: 'Quicksand', 'Nunito', sans-serif;
        }

        .splash-sub {
            font-size: 0.86rem;
            font-weight: 600;
            color: #94a3b8;
            margin: 0 0 22px;
            letter-spacing: 0.02em;
        }

        .splash-progress-track {
            width: 130px;
            height: 4px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 999px;
            overflow: hidden;
            position: relative;
            margin-bottom: 14px;
        }

        .splash-progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 45%;
            background: linear-gradient(90deg, #4f46e5, #f59e0b, #4f46e5);
            background-size: 200% 100%;
            border-radius: 999px;
            animation: splashProgress 1.3s ease-in-out infinite;
        }

        @keyframes splashProgress {
            0% { left: -45%; }
            100% { left: 100%; }
        }

        .splash-badge {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.06);
            padding: 3px 12px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
